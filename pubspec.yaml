name: friday
description: "A lightweight desktop backup manager for Windows. Create versioned snapshots of your projects."
publish_to: "none"
version: 2.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  google_fonts: ^8.2.1
  file_picker: ^13.1.0
  archive: ^4.0.9
  crypto: ^3.0.7
  path: ^1.9.1
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  local_notifier: ^0.1.6
  intl: ^0.20.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.3.0
  phosphoricons_flutter: ^1.1.1
  sqflite_common_ffi: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  windows:
    generate: true
    image_path: "assets/app_icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/
